<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futocoron versions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap">
<style>
:root{--bg:#FBFBF8;--card:#FFFFFF;--ink:#23262B;--mut:#6B6F76;--line:#E2E0D8;--acc:#1F6FA8;--pink:#E58CB3}
@media (prefers-color-scheme:dark){:root{--bg:#15181B;--card:#1F2327;--ink:#ECEAE4;--mut:#9AA0A6;--line:#30363B;--acc:#7FC4EA}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 16px 40px}
svg{display:block;width:150px;margin:0 auto}
h1{font-size:28px;margin:10px 0 2px;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0 0 22px;line-height:1.45}
a.v{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:12px}
a.v:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
a.v.latest{border:2px solid var(--pink)}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.name{font-size:19px;font-weight:700}
.date{color:var(--mut);font-size:14px}
.tag{font-size:12px;font-weight:700;background:var(--pink);color:#3A1426;border-radius:999px;padding:2px 10px}
.what{margin:6px 0 0;color:var(--mut);line-height:1.45;font-size:15px}
.foot{color:var(--mut);font-size:14px;line-height:1.5;margin-top:24px}
</style>
</head>
<body>
<main>
<svg viewBox="0 0 300 250" role="img" aria-label="Futocoron face">
<ellipse cx="52" cy="172" rx="26" ry="20" fill="#E58CB3"/><ellipse cx="248" cy="172" rx="26" ry="20" fill="#E58CB3"/>
<ellipse cx="90" cy="125" rx="11" ry="14" fill="currentColor"/><ellipse cx="210" cy="125" rx="11" ry="14" fill="currentColor"/>
<path d="M125 178 Q150 198 175 178" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
</svg>
<h1>Futocoron</h1>
<p class="sub">Pick a version to open.</p>
<div id="list"></div>
<p class="foot">All versions share one cloud garden on this phone, so your photos appear in each of them. Older versions show fewer details for each photo.</p>
</main>
<script>
// Versions are found automatically: any file in this folder named v<number>-<name>.html is listed.
// The list below is only used if the automatic lookup fails.
const FALLBACK=[
  {file:"v2-field-notes.html",name:"Version 2: Field notes",date:"12 Nov 2026",what:"The camera lives in Futocoron’s eyes. Each photo gets your description, Futocoron’s description, cloud type, weather, GPS, the forecast and a prediction."},
  {file:"v1-first-look.html",name:"Version 1: First look",date:"9 Nov 2026",what:"The first sketch: a face, a separate camera screen with zoom, and a simple garden."}
];
const list=document.getElementById("list");
const num=f=>parseInt((f.match(/^v(\d+)/i)||[0,0])[1],10);
function nice(f){const m=f.match(/^v(\d+)[-_ ]?(.*)\.html$/i);if(!m)return f;const w=m[2].replace(/[-_]+/g," ").trim();return "Version "+m[1]+(w?": "+w.charAt(0).toUpperCase()+w.slice(1):"")}
function draw(vs){
  list.innerHTML="";
  vs.forEach((v,i)=>{
    const a=document.createElement("a");a.className="v"+(i===0?" latest":"");a.href=v.file;
    const top=document.createElement("div");top.className="top";
    const n=document.createElement("span");n.className="name";n.textContent=v.name;top.append(n);
    if(i===0){const t=document.createElement("span");t.className="tag";t.textContent="Latest";top.append(t)}
    if(v.date){const d=document.createElement("span");d.className="date";d.textContent=v.date;top.append(d)}
    a.append(top);
    if(v.what){const w=document.createElement("p");w.className="what";w.textContent=v.what;a.append(w)}
    list.append(a);
  });
}
async function details(file){
  const v={file,name:nice(file),date:"",what:""};
  try{
    const r=await fetch(file,{cache:"no-cache"});if(!r.ok)return v;
    const doc=new DOMParser().parseFromString(await r.text(),"text/html");
    const g=n=>{const m=doc.querySelector('meta[name="'+n+'"]');return m?m.getAttribute("content")||"":""};
    v.name=g("version-name")||v.name;v.date=g("version-date");v.what=g("description");
  }catch(e){}
  return v;
}
async function discover(){
  const host=location.hostname;if(!/\.github\.io$/i.test(host))throw new Error("not on GitHub Pages");
  const owner=host.split(".")[0],parts=location.pathname.split("/").filter(Boolean);
  if(parts.length&&/\.html?$/i.test(parts[parts.length-1]))parts.pop();
  const repo=parts.length?parts.shift():host;
  const r=await fetch("https://api.github.com/repos/"+owner+"/"+repo+"/contents/"+parts.join("/"),{headers:{accept:"application/vnd.github+json"}});
  if(!r.ok)throw new Error("GitHub "+r.status);
  const files=(await r.json()).filter(f=>f.type==="file"&&/^v\d+.*\.html$/i.test(f.name)).map(f=>f.name);
  if(!files.length)throw new Error("no version files");
  files.sort((a,b)=>num(b)-num(a)||b.localeCompare(a));
  return Promise.all(files.map(details));
}
draw(FALLBACK);
discover().then(draw).catch(()=>{});
</script>
</body>
</html>
